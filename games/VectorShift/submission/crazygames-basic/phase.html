<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#edf5f1">
<meta name="description" content="A tactile offline puzzle about winding arrows, shifting phases and finding a way out.">
<title>Vector Shift</title>
<script src="https://sdk.crazygames.com/crazygames-sdk-v3.js"></script>
<!-- CrazyGames Basic: GameplayStart only; no ads module calls. -->
<style>
:root{
  --bg:#eef5f1;--panel:#ffffff;--board:#eaf2ee;--grid:#d9e6df;
  --ink:#19352f;--muted:#60736d;--dim:#899a94;--line:#d6e2dc;
  --cyan:#16a6a0;--cyan-soft:#d9f3ef;--cyan-deep:#087c76;
  --gold:#f2a33a;--gold-soft:#fff0d7;--gold-deep:#a95b16;
  --danger:#d94b55;--ok:#188b68;--r:14px;
  --snake-outline:#18332d;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;color:var(--ink);
  background:linear-gradient(145deg,#f8fbf8 0%,var(--bg) 58%,#e8f0ef 100%);
  font-family:Inter,'Noto Sans SC','PingFang SC',ui-sans-serif,system-ui,-apple-system,sans-serif;
  min-height:100vh;min-height:100dvh;
}
button{font:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
button:disabled{opacity:.32;cursor:not-allowed}
button:focus-visible{outline:3px solid var(--cyan);outline-offset:2px}
button:active:not(:disabled){transform:scale(.98)}
.sr-only{
  position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;
  overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;
}

.page-shell{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}

.play-top{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:10px 15px;
  max-width:790px;margin:0 auto;width:100%;
}
.icon-btn{
  width:44px;height:44px;border-radius:14px;border:1px solid var(--line);
  background:var(--panel);color:var(--ink);font-size:18px;font-weight:700;
  display:grid;place-items:center;flex-shrink:0;
}
.icon-btn:hover{background:#fff}
.level-pill-wrap{display:flex;align-items:center;gap:7px;flex-wrap:wrap;justify-content:center;min-width:0}
.level-chip{
  font-size:14px;font-weight:800;padding:8px 14px;border-radius:999px;
  background:var(--panel);border:1px solid var(--line);color:var(--ink);
  letter-spacing:0;box-shadow:0 2px 8px #18332d0a;
}
.remain-pill{
  font-size:12px;font-weight:650;padding:7px 11px;border-radius:999px;
  background:var(--cyan-soft);color:var(--cyan-deep);border:1px solid #b6e8ef;
}
.remain-pill strong{font-size:14px;font-variant-numeric:tabular-nums}
.session-pill{display:flex;align-items:center;gap:6px;min-height:34px;padding:6px 10px;border-radius:999px;background:#fff;border:1px solid var(--line);color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}

.main{
  width:min(100%,790px);margin:0 auto;padding:4px 16px max(14px,env(safe-area-inset-bottom));
  display:flex;flex-direction:column;gap:7px;flex:1;min-height:0;
}
.teach-line{
  margin:0;font-size:13px;line-height:1.4;color:var(--muted);text-align:center;min-height:1.3em;overflow-wrap:anywhere;
}

.play-section{display:flex;flex:1;min-height:0;align-items:center;justify-content:center}
.board-frame{
  position:relative;margin:0 auto;width:min(100%,680px,calc(100dvh - 166px));
  padding:12px;background:var(--panel);border:1px solid var(--line);
  border-radius:16px;box-shadow:0 16px 42px #18332d12;overflow:hidden;
  touch-action:none;user-select:none;
  isolation:isolate;
}
.board-scene{position:relative;width:100%;aspect-ratio:1;transform:translate(var(--pan-x,0px),var(--pan-y,0px)) scale(var(--zoom,1));transform-origin:center;will-change:transform}
.board{
  aspect-ratio:1;display:grid;gap:3px;width:100%;position:relative;z-index:1;
}
.grid-cell{
  position:relative;background:var(--board);border-radius:8px;min-width:0;min-height:0;
  box-shadow:inset 0 1px 2px #00000008;
}
.grid-cell.void{
  background:transparent;box-shadow:none;pointer-events:none;
}
.board[data-shape]:not([data-shape=square]) .grid-cell:not(.void){
  box-shadow:inset 0 1px 2px #00000010;
}
.grid-cell.hint-cell{box-shadow:0 0 0 3px #f0d080 inset;animation:cellGlow .65s alternate 3}
.grid-cell.hit-cell{box-shadow:0 0 0 2px var(--danger) inset;background:#ffe4e4}

.arrow-layer{
  position:absolute;inset:0;width:100%;height:100%;
  z-index:2;pointer-events:auto;overflow:visible;touch-action:none;
}
.snake-group>*{pointer-events:none}
.ray-layer{
  position:absolute;inset:0;z-index:3;pointer-events:none;
}
.fx-canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:4;border-radius:12px}

.snake-hit{
  fill:none;stroke:transparent;stroke-linecap:round;stroke-linejoin:round;
  pointer-events:stroke;cursor:pointer;touch-action:manipulation;outline:none;
}
.snake-hit:focus-visible{stroke:var(--cyan);stroke-width:5;stroke-dasharray:2 5;opacity:.9}
.snake-group{transition:transform .22s ease}
.snake-group.rotating{transition:transform .28s cubic-bezier(.2,.7,.2,1)}
.snake-outline{fill:none;stroke:var(--snake-outline);stroke-linecap:round;stroke-linejoin:round;opacity:.88}
.snake-body{fill:none;stroke-linecap:round;stroke-linejoin:round}
.snake-hi{fill:none;stroke:#ffffff;stroke-linecap:round;stroke-linejoin:round;opacity:.55}
.snake-shade{fill:none;stroke-linecap:round;stroke-linejoin:round}
.snake-head{stroke:var(--snake-outline);stroke-width:1.5;stroke-linejoin:round}
.snake-head.tip{filter:brightness(.88)}
.snake-eye-white,.snake-eye-pupil{pointer-events:none}

.exit-cell{
  position:absolute;border-radius:9px;pointer-events:none;
  animation:pathPulse .9s ease-in-out infinite alternate;
}
.exit-cell.clear{background:rgba(62,207,122,.38);box-shadow:inset 0 0 0 2px #3ecf7a}
.exit-cell.blocked{background:rgba(255,92,92,.42);box-shadow:inset 0 0 0 2px #ff5c5c;animation:rayFlash .35s ease 2}
.exit-cell.global{border-radius:50%;background:#ffffffdf;box-shadow:0 0 0 2px var(--ray-color),0 1px 5px #18332d30;animation:none;opacity:.95}
.visual-mode .board-frame{border-color:var(--cyan);box-shadow:0 0 0 3px var(--cyan-soft),0 16px 42px #18332d12}
.exit-ray-legacy{display:none}

.snake-group.blocked{animation:bad .28s linear 2}
.snake-group.sliding{
  transition:transform var(--slide-ms,340ms) cubic-bezier(.15,.7,.2,1),opacity var(--slide-ms,340ms) ease-out;
}

.dock{
  display:grid;grid-template-columns:1.55fr 1fr 1fr 1fr;gap:8px;
  padding:6px 0 0;
}
.btn{min-height:50px;border-radius:16px;transition:background .15s ease,transform .1s ease}
.dock-btn{
  border:1px solid var(--line);background:var(--panel);color:var(--ink);font-size:13px;font-weight:700;
  box-shadow:0 2px 6px #00000008;
}
.dock-btn:hover:not(:disabled){background:#fff;transform:translateY(-1px)}
.phase-button{
  min-height:50px;border:0;border-radius:16px;
  background:linear-gradient(135deg,#2ec4d6,#5b8def);color:#fff;
  display:flex;align-items:center;justify-content:center;gap:8px;font-weight:800;font-size:14px;
  box-shadow:0 8px 18px #2ec4d644;
}
.phase-button:hover{filter:brightness(1.05)}
.phase-symbol{font-size:18px}
.phase-btn-text{display:flex;flex-direction:column;align-items:flex-start;line-height:1.1}
.phase-btn-text small{font-size:10px;font-weight:650;opacity:.9}
.hint-button{color:var(--gold-deep)}

.board-tools{display:flex;align-items:center;justify-content:center;gap:4px;min-height:42px}
.tool-button{width:44px;height:44px;border:1px solid transparent;border-radius:10px;background:transparent;color:var(--muted);font-size:20px;font-weight:650;display:grid;place-items:center}
.tool-button:hover,.tool-button[aria-pressed=true]{background:#fff;border-color:var(--line);color:var(--ink)}
.tool-reset{font-size:18px;margin-left:8px}
.tool-visualizer{font-size:17px;margin-left:4px}
.zoom-readout{min-width:48px;text-align:center;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}

.response{
  min-height:36px;font-size:12px;padding:9px 12px;border-radius:12px;
  background:rgba(255,253,247,.85);border:1px solid var(--line);color:var(--muted);line-height:1.4;text-align:center;
}
.response.warn{border-color:#ffc9c9;color:#b03434;background:#fff1f1}
.response.good{border-color:#b6ebc8;color:#217a45;background:#eefaf2}

.foot-pager{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.pager-btn{border:1px solid var(--line);background:transparent;color:var(--muted);font-size:15px;min-height:44px;border-radius:12px;font-weight:700}
.pager-btn:hover:not(:disabled){background:var(--panel);color:var(--ink)}

.overlay{position:fixed;inset:0;z-index:30;background:#24304066;display:flex;align-items:center;justify-content:center;padding:18px;backdrop-filter:blur(6px)}
.overlay.hidden{display:none}
.modal{
  width:min(100%,460px);max-height:92vh;max-height:92dvh;overflow:auto;border:1px solid var(--line);border-radius:14px;
  background:var(--panel);padding:22px;box-shadow:0 20px 50px #00000022;position:relative;color:var(--ink);
}
.modal h2{font-size:22px;margin:10px 0 8px;letter-spacing:0}
.modal p{color:var(--muted);line-height:1.65;font-size:13px}
.modal .modal-sub{font-size:11px;color:var(--cyan-deep);letter-spacing:.1em;font-weight:750}
.modal .modal-actions{display:flex;gap:8px;margin-top:18px;flex-wrap:wrap}
.modal .modal-actions button{flex:1;min-width:110px;padding:12px 14px;border-radius:12px;background:#eef2f5;color:var(--ink);border:1px solid var(--line);min-height:44px}
.modal .modal-actions .main-button{background:var(--cyan);color:#fff;font-weight:750;border-color:var(--cyan)}
.modal .close-button{position:absolute;top:12px;right:12px;border:0;background:#eef2f5;color:var(--ink);border-radius:8px;width:44px;height:44px;font-size:20px}

.level-tiles{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-top:14px}
.level-tiles button{
  border:1px solid var(--line);background:#f7f3eb;color:var(--ink);border-radius:10px;aspect-ratio:1;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-weight:750;font-size:13px;
}
.level-tiles button small{font-size:9px;font-weight:500;color:var(--dim)}
.level-tiles button.current{border-color:var(--cyan);background:var(--cyan-soft)}
.level-tiles button.done{background:#e5f3ea;border-color:#b5dcc4}
.level-tiles button.locked{opacity:.4}

.coach{position:fixed;inset:0;z-index:25;pointer-events:none}
.coach.hidden{display:none}
.coach-card{
  pointer-events:auto;position:fixed;width:min(260px,calc(100vw - 24px));
  background:var(--panel);border:1px solid var(--cyan);border-radius:14px;padding:14px;
  box-shadow:0 14px 32px #0002;color:var(--ink);
}
.coach-card p{margin:0 0 10px;font-size:12px;line-height:1.5}
.coach-card button{width:100%;min-height:44px;border:0;border-radius:10px;background:var(--cyan);color:#fff;font-weight:750}
.phase-spotlight{box-shadow:0 0 0 3px #fff,0 0 0 6px var(--cyan)!important}
.onboard-step{min-height:3.2em}
.onboard-dots{display:flex;gap:7px;margin:14px 0 4px}
.onboard-dots i{width:8px;height:8px;border-radius:99px;background:var(--line);display:block}
.onboard-dots i.on{background:var(--cyan)}

.set-row{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid var(--line);font-size:13px;cursor:pointer;min-height:44px}
.set-row input{width:18px;height:18px;accent-color:var(--cyan)}
.opt-box{margin-top:12px;padding:12px;border:1px solid var(--line);border-radius:10px;background:#f7f3eb}
.opt-box.hidden{display:none}
.opt-label{font-size:10px;letter-spacing:.08em;color:var(--cyan-deep);margin-bottom:6px}
.opt-box code{font-size:11px;line-height:1.6;color:var(--ink);word-break:break-word}
.daily-meta{font-size:12px;color:var(--dim)}
.result-mark{font-size:38px;line-height:1;color:var(--gold-deep);font-variant-numeric:tabular-nums}
.result-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(72px,1fr));margin:18px 0;border-block:1px solid var(--line)}
.result-stats div{padding:12px 8px;min-width:0}
.result-stats div+div{border-left:1px solid var(--line)}
.result-stats small{display:block;color:var(--muted);font-size:10px;overflow-wrap:anywhere}
.result-stats strong{display:block;margin-top:5px;font-size:17px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.share-copy{flex-basis:100%!important}
.chapter-label{font-size:11px;color:var(--muted);font-weight:650}
.gear-menu{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.gear-menu button{
  width:100%;min-height:48px;border-radius:12px;border:1px solid var(--line);
  background:#f7f3eb;font-weight:700;text-align:left;padding:12px 14px;
}

@keyframes bad{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
@keyframes cellGlow{to{box-shadow:0 0 0 4px var(--gold) inset}}
@keyframes rayFlash{0%,100%{opacity:.9}50%{opacity:.35}}
@keyframes pathPulse{from{opacity:.55}to{opacity:.95}}

@media(max-width:600px){
  .play-top{padding:8px 10px}
  .main{padding:2px 10px max(14px,env(safe-area-inset-bottom));gap:6px}
  .board-frame{padding:9px;border-radius:14px;width:min(100%,calc(100dvh - 166px))}
  .dock{grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
  .dock-btn{min-width:0;padding:0 5px}
  .board-tools{min-height:40px}
  .level-tiles{grid-template-columns:repeat(5,1fr)}
}
@media(max-width:390px){
  .main{padding:2px 8px max(12px,env(safe-area-inset-bottom))}
  .board{gap:2px}
  .level-tiles{grid-template-columns:repeat(4,1fr)}
  .level-chip{font-size:13px;padding:7px 12px}
  .level-pill-wrap{gap:4px}
  .remain-pill{padding:6px 8px;font-size:11px}
  .session-pill{gap:4px;padding:5px 7px;font-size:11px}
  .dock{grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}
  .phase-button{grid-column:span 2}
  .dock .btn,.phase-button{min-height:48px}
  .result-stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .result-stats div:nth-child(even){border-left:1px solid var(--line)}
  .result-stats div:nth-child(n+3){border-top:1px solid var(--line)}
  .result-stats div:last-child:nth-child(odd){grid-column:1/-1;display:flex;align-items:center;justify-content:space-between}
}
@media(max-height:560px) and (orientation:landscape){
  .play-top{padding-block:4px}
  .main{display:grid;grid-template-columns:minmax(0,1fr) minmax(250px,330px);grid-template-rows:auto auto auto auto;align-content:center;column-gap:14px;padding-block:4px}
  .play-section{grid-column:1;grid-row:1 / span 4}
  .board-frame{width:min(100%,calc(100dvh - 100px));padding:7px}
  .teach-line{grid-column:2;text-align:left}
  .board-tools{grid-column:2;grid-row:2}
  .dock{grid-column:2;grid-row:3;grid-template-columns:repeat(2,minmax(0,1fr))}
  .phase-button{grid-column:span 2}
  .response{grid-column:2;grid-row:4}
  .foot-pager{display:none}
}
@media(min-width:1000px) and (min-height:800px){.board-frame{width:min(100%,700px,calc(100dvh - 166px))}.main{padding-inline:20px}}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;transition-duration:.001ms!important;scroll-behavior:auto!important}
  .fx-canvas{display:none}
}

</style>
</head>
<body>
<div class="page-shell">
  <header class="play-top">
    <button id="levelMenuButton" class="icon-btn" type="button" aria-label="Levels">☰</button>
    <div class="level-pill-wrap">
      <span class="level-chip" id="levelChip">1 / 52</span>
      <span class="remain-pill" id="remainPill"><span id="labelRemain">Left</span> <strong id="remainingStat">0</strong></span>
      <span class="session-pill" aria-live="off"><span id="timerStat">00:00</span><span aria-hidden="true">·</span><span id="mistakeStat">0</span><span id="labelMistakes" class="sr-only">Mistakes</span></span>
    </div>
    <button id="gearButton" class="icon-btn" type="button" aria-label="Menu">⋯</button>
  </header>
  <main class="main">
    <p class="teach-line" id="missionText">Tap an arrow with a clear path.</p>
    <section class="play-section" aria-label="Game board">
      <div class="board-frame" id="boardFrame">
        <div id="boardScene" class="board-scene">
          <div id="board" class="board" role="group" aria-label="Arrow board"></div>
          <svg id="arrowLayer" class="arrow-layer" aria-label="Puzzle arrows"></svg>
          <canvas id="fxCanvas" class="fx-canvas" aria-hidden="true"></canvas>
          <div id="rayLayer" class="ray-layer" aria-hidden="true"></div>
        </div>
      </div>
    </section>
    <div class="board-tools" role="toolbar" aria-label="Board view">
      <button id="zoomOutButton" class="tool-button" type="button" aria-label="Zoom out" title="Zoom out">−</button>
      <output id="zoomReadout" class="zoom-readout" aria-live="polite">100%</output>
      <button id="zoomInButton" class="tool-button" type="button" aria-label="Zoom in" title="Zoom in">+</button>
      <button id="zoomResetButton" class="tool-button tool-reset" type="button" aria-label="Reset board view" title="Reset view">⤢</button>
      <button id="visualizerButton" class="tool-button tool-visualizer" type="button" aria-pressed="false" aria-label="Show all arrow exits" title="Show all arrow exits">◎</button>
    </div>
    <nav class="dock" aria-label="Controls">
      <button id="phaseButton" class="phase-button" type="button">
        <span class="phase-symbol">⟳</span>
        <span class="phase-btn-text">
          <span id="phaseBtnTitle">Phase</span>
          <small id="phaseBtnDetail">0</small>
        </span>
      </button>
      <button id="undoButton" class="btn dock-btn" type="button"><span id="undoLabel">Undo</span></button>
      <button id="resetButton" class="btn dock-btn" type="button"><span id="resetLabel">Retry</span></button>
      <button id="hintButton" class="btn dock-btn hint-button" type="button"><span id="hintLabel">Hint</span></button>
    </nav>
    <div class="response" id="feedback" role="status" aria-live="polite">Pick an arrow.</div>
    <div class="foot-pager">
      <button id="prevButton" class="btn pager-btn" type="button">←</button>
      <button id="helpButton" class="btn pager-btn" type="button">?</button>
      <button id="nextButton" class="btn pager-btn" type="button">→</button>
    </div>
    <!-- Hidden legacy hooks used by settings / coolmath scrub; not shown in play UI -->
    <div class="sr-only" aria-hidden="true">
      <button id="settingsButton" type="button">Settings</button>
      <button id="dailyButton" type="button">Daily</button>
      <button id="exportButton" type="button">Export log</button>
      <button id="soundButton" type="button">Sound: Off</button>
      <span id="footerLeft"></span><span id="footerRight"></span>
      <span id="labelMoves"></span><span id="movesStat"></span>
      <span id="labelPhase"></span><span id="togglesStat"></span><span id="phaseBadge"></span>
      <span id="bestStat"></span>
      <span id="legendCyan"></span><span id="legendGold"></span>
    </div>
  </main>
</div>
<div id="coach" class="coach hidden" aria-hidden="true"></div>
<div id="overlay" class="overlay hidden" aria-hidden="true" inert><div id="modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"></div></div>
<script>
window.VS_CHANNEL="crazygames-basic";
/* Vector Shift original mechanical logic. Shared by the browser and Node test harness.
 * Arrows are polyomino/snake bodies: cells[0]=tail … cells[last]=head; d = exit facing from head.
 * Blue arrows: phase rotates facing (d+phase)%4 AND body 90° CW around the head (y-down).
 * Optional mask/shape: playable cells form a silhouette. Exit ray that steps into non-playable
 * "void" is CLEAR (Arrow Out irregular-board rule). Absent mask ⇒ full size×size square.
 */
(function(root){
'use strict';
const DX=[0,1,0,-1],DY=[-1,0,1,0];
const playableCache=typeof WeakMap!=='undefined'?new WeakMap():null;

function headCell(a){
  if(a.cells&&a.cells.length){const c=a.cells[a.cells.length-1];return {x:c[0],y:c[1]}}
  return {x:a.x,y:a.y};
}
function normalizeArrow(a){
  if(a.cells&&a.cells.length)return a;
  return {id:a.id,color:a.color,d:a.d,cells:[[a.x,a.y]]};
}
function rotCW(dx,dy){return [-dy,dx]}
function cellsAtPhase(a,phase){
  const base=normalizeArrow(a).cells;
  const cells=base.map(c=>[c[0],c[1]]);
  const turns=(a.color==='blue'?(phase|0):0)%4;
  if(!turns)return cells;
  const hx=cells[cells.length-1][0],hy=cells[cells.length-1][1];
  for(let t=0;t<turns;t++){
    for(let i=0;i<cells.length-1;i++){
      const dx=cells[i][0]-hx,dy=cells[i][1]-hy;
      const r=rotCW(dx,dy);
      cells[i]=[hx+r[0],hy+r[1]];
    }
  }
  return cells;
}
function direction(a,phase){return (a.d+(a.color==='blue'?phase:0))%4}

const BLUE_PAL=['#2ec4d6','#3d9bff','#5b8def','#00bfa6','#7c6cf0','#20c997','#4cc9f0','#4361ee'];

function eyePair(hx,hy,d,m,bodyW){

function paintSnakes(opts={}){

  const a=core.arrow(lv,id);if(!a)continue;

  g.setAttribute('class','snake-group'+(opts.rotateBlue&&a.color==='blue'?' rotating':''));

  const pts=polylinePoints(cells,m);

   const p=cellCenter(cells[0][0],cells[0][1],m);
   const r=bodyW*0.48;
   g.appendChild(mk('circle',{cx:p.cx,cy:p.cy,r:String(r+m.cell*0.08),fill:cols.outline}));
   g.appendChild(mk('circle',{cx:p.cx,cy:p.cy,r:String(r),fill:cols.fill}));
   g.appendChild(mk('ellipse',{cx:String(p.cx-r*0.18),cy:String(p.cy-r*0.38),rx:String(r*0.48),ry:String(r*0.30),fill:'#ffffff',opacity:'0.72'}));
  }else{
   const mkPoly=(cls,points,sw,stroke,op)=>{
    const pl=mk('polyline',{class:cls,points:points,'stroke-width':String(sw),stroke:stroke,fill:'none','stroke-linecap':'round','stroke-linejoin':'round'});
    if(op!=null)pl.setAttribute('opacity',String(op));

   };
   g.appendChild(mkPoly('snake-outline',pts,outlineW,cols.outline,0.98));
   g.appendChild(mkPoly('snake-shade',shadePts,shadeW,cols.deep,0.42));
   g.appendChild(mkPoly('snake-body',pts,bodyW,cols.fill,1));
   g.appendChild(mkPoly('snake-hi-mid',hiPts,Math.max(5,m.cell*0.32),'#ffffff',0.28));

  }

  g.appendChild(chev);

   g.appendChild(mk('circle',{class:'snake-eye-pupil',cx:String(e.px),cy:String(e.py),r:String(e.pr),fill:'#1a2430'}));
  }

  const hit=mk('polyline',{class:'snake-hit',points:polylinePoints(hitCells,m),fill:'none',stroke:'transparent','stroke-linecap':'round','stroke-linejoin':'round','stroke-width':String(Math.max(bodyW,m.cell*0.76)),'pointer-events':'stroke','data-piece-id':String(a.id),'data-testid':'piece-'+a.id,'data-snake-id':String(a.id),tabindex:'0',role:'button'});

function tone(kind){
 if(!sound)return;
 try{
  const Audio=window.AudioContext||window.webkitAudioContext;if(!Audio)return;
  const ctx=tone.ctx||(tone.ctx=new Audio()),now=ctx.currentTime;
  const beep=(freq,dur,type,vol,delay)=>{
   const osc=ctx.createOscillator(),gain=ctx.createGain();
   osc.type=type||'sine';osc.frequency.setValueAtTime(freq,now+delay);
   gain.gain.setValueAtTime(Math.max(0.0001,vol),now+delay);
   gain.gain.exponentialRampToValueAtTime(.001,now+delay+dur);
   osc.connect(gain);gain.connect(ctx.destination);osc.start(now+delay);osc.stop(now+delay+dur+.02);
  };
  if(kind==='remove'){beep(520,.06,'triangle',.055,0);beep(780,.08,'sine',.045,.045)}
  else if(kind==='toggle'){beep(300,.07,'sine',.045,0);beep(420,.09,'triangle',.05,.06)}
  else if(kind==='blocked'){beep(170,.1,'square',.035,0);beep(130,.12,'square',.03,.07)}
  else if(kind==='win'){beep(523,.09,'sine',.055,0);beep(659,.1,'sine',.05,.09);beep(784,.12,'triangle',.048,.2)}
  else beep(650,.07,'sine',.045,0);
 }catch{}
}

function setupBoardGestures(){
 const frame=$('boardFrame');if(!frame)return;
 frame.addEventListener('wheel',e=>{if(e.ctrlKey||e.deltaY!==0){e.preventDefault();zoomAt(zoom*(e.deltaY<0?1.12:1/1.12),e.clientX,e.clientY)}},{passive:false});
 frame.addEventListener('pointerdown',e=>{
  if(e.pointerType==='mouse'&&e.button!==0)return;
  if(!framePointers.size)suppressedClicks.delete(e.pointerId);
  framePointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(framePointers.size===2){
   const pts=[...framePointers.values()],mid={x:(pts[0].x+pts[1].x)/2,y:(pts[0].y+pts[1].y)/2};
   for(const id of framePointers.keys())suppressedClicks.add(id);
   frameGesture={kind:'pinch',distance:Math.max(1,Math.hypot(pts[0].x-pts[1].x,pts[0].y-pts[1].y)),zoom,pan:{...pan},mid};
   try{frame.setPointerCapture(e.pointerId)}catch{}
  }else if(framePointers.size===1&&zoom>1&&!e.target.closest('.snake-hit')){
   frameGesture={kind:'pan',pointerId:e.pointerId,start:{x:e.clientX,y:e.clientY},pan:{...pan},moved:false};
   try{frame.setPointerCapture(e.pointerId)}catch{}
  }
 },{passive:true});
 frame.addEventListener('pointermove',e=>{
  if(!framePointers.has(e.pointerId))return;
  framePointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(!frameGesture)return;
  if(frameGesture.kind==='pinch'&&framePointers.size>=2){
   const pts=[...framePointers.values()].slice(0,2),distance=Math.max(1,Math.hypot(pts[0].x-pts[1].x,pts[0].y-pts[1].y));
   const mid={x:(pts[0].x+pts[1].x)/2,y:(pts[0].y+pts[1].y)/2};
   const r=frame.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;
   const factor=Math.max(1,Math.min(2.2,frameGesture.zoom*distance/frameGesture.distance));
   const wx=(frameGesture.mid.x-cx-frameGesture.pan.x)/frameGesture.zoom,wy=(frameGesture.mid.y-cy-frameGesture.pan.y)/frameGesture.zoom;
   zoom=factor;pan=zoom===1?{x:0,y:0}:{x:mid.x-cx-wx*zoom,y:mid.y-cy-wy*zoom};applyBoardTransform();
   if(Math.abs(distance-frameGesture.distance)>6)frameGesture.moved=true;
  }else if(frameGesture.kind==='pan'){
   const dx=e.clientX-frameGesture.start.x,dy=e.clientY-frameGesture.start.y;
   if(Math.hypot(dx,dy)>5){frameGesture.moved=true;suppressedClicks.add(frameGesture.pointerId);pan={x:frameGesture.pan.x+dx,y:frameGesture.pan.y+dy};applyBoardTransform()}
  }
 },{passive:true});
 const end=e=>{framePointers.delete(e.pointerId);if(!framePointers.size)frameGesture=null};
 frame.addEventListener('pointerup',end);frame.addEventListener('pointercancel',end);
}
function sizeFxCanvas(){
 const canvas=$('fxCanvas'),scene=$('boardScene');
 if(!canvas||!scene)return;
 const width=scene.clientWidth,height=scene.clientHeight;
 const dpr=Math.min(2,window.devicePixelRatio||1);
 canvas.width=Math.floor(width*dpr);canvas.height=Math.floor(height*dpr);
 canvas.style.width=width+'px';canvas.style.height=height+'px';
}
function spawnBurst(clientX,clientY,color){
 if(reducedMotion())return;
 const canvas=$('fxCanvas'),scene=$('boardScene'),frame=$('boardFrame');
 if(!canvas||!frame||!scene)return;
 const fr=frame.getBoundingClientRect(),z=zoom;
 const x=(clientX-(fr.left+fr.width/2)-pan.x)/z+scene.clientWidth/2;
 const y=(clientY-(fr.top+fr.height/2)-pan.y)/z+scene.clientHeight/2;
 for(let i=0;i<8;i++){
  const ang=Math.random()*Math.PI*2,sp=30+Math.random()*60;
  particles.push({x,y,vx:Math.cos(ang)*sp,vy:Math.sin(ang)*sp,life:0.3+Math.random()*0.2,age:0,color,r:1.5+Math.random()*2});
 }
 if(!spawnBurst.raf)spawnBurst.raf=requestAnimationFrame(tickFx);
}
function tickFx(ts){
 const canvas=$('fxCanvas');if(!canvas){spawnBurst.raf=0;return}
 const ctx=canvas.getContext('2d');
 const dpr=Math.min(2,window.devicePixelRatio||1);
 ctx.clearRect(0,0,canvas.width,canvas.height);
 const last=tickFx.last||ts;const dt=Math.min(0.05,(ts-last)/1000);tickFx.last=ts;
 particles=particles.filter(p=>{
  p.age+=dt;if(p.age>=p.life)return false;
  p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=50*dt;
  const a=1-p.age/p.life;
  ctx.globalAlpha=a*0.65;ctx.fillStyle=p.color;
  ctx.beginPath();ctx.arc(p.x*dpr,p.y*dpr,p.r*dpr,0,Math.PI*2);ctx.fill();
  return true;
 });
 ctx.globalAlpha=1;
 if(particles.length)spawnBurst.raf=requestAnimationFrame(tickFx);
 else{spawnBurst.raf=0;tickFx.last=0}
}

function slideOff(a,done){
 const g=document.querySelector(`[data-snake-id="${a.id}"]`);
 const d=core.direction(a,state.phase);
 const m=cellMetrics();
 const dist=m.width*1.35;
 const dx=core.DX[d]*dist,dy=core.DY[d]*dist;
 clearRays();
 drawRay(a.id,'clear');
 if(reducedMotion()||!g){done();return}
 animating=true;
 if(!reducedMotion()&&g.parentNode){
  const clone=g.cloneNode(true);
  clone.removeAttribute('data-snake-id');
  clone.style.opacity='0.35';
  clone.style.pointerEvents='none';
  g.parentNode.appendChild(clone);
  requestAnimationFrame(()=>{
   clone.style.transition='opacity 280ms ease-out,transform 360ms ease-out';
   clone.style.opacity='0';
   clone.style.transform=`translate(${dx*0.55}px,${dy*0.55}px)`;
   setTimeout(()=>clone.remove(),380);
  });
 }
 g.classList.add('sliding');
 g.style.setProperty('--slide-ms','360ms');
 g.style.transform=`translate(${dx}px,${dy}px)`;
 g.style.opacity='0';
 const btn=document.querySelector(`[data-piece-id="${a.id}"]`);
 if(btn){btn.style.transition='opacity .28s';btn.style.opacity='0'}
 setTimeout(()=>{clearRays();animating=false;done()},reducedMotion()?0:380);
}

function remove(id){
 if(completionScheduled||animating||!state.remaining.includes(id))return;
 const b=core.blockers(level(),state,id);if(b===null)return;
 if(b.length){
  mistakes++;saveRun();if($('mistakeStat'))$('mistakeStat').textContent=String(mistakes);
  blockedStreak++;
  log('blocked_click',{id,blockedBy:b,streak:blockedStreak});
  message((!settings.quietHints&&blockedStreak>=3)?t.blockedSoft:t.blocked,'warn');
  tone('blocked');haptic(12);
  clearRays();drawRay(id,'blocked');
  const g=document.querySelector(`[data-snake-id="${id}"]`);g?.classList.add('blocked');
  for(const hit of b){
   const cells=core.cellsAtPhase(core.arrow(level(),hit),state.phase);
   for(const [x,y] of cells){
    const el=document.querySelector(`[data-x="${x}"][data-y="${y}"]`);
    el?.classList.add('hit-cell');
   }
  }
  blockedTimer++;const seq=blockedTimer;
  setTimeout(()=>{
   if(seq!==blockedTimer)return;
   document.querySelectorAll('.hit-cell').forEach(el=>el.classList.remove('hit-cell'));
   g?.classList.remove('blocked');clearRays();
  },620);
  return;
 }
 blockedStreak=0;
 const a=core.arrow(level(),id);
  const hit=document.querySelector(`[data-piece-id="${id}"]`);
  if(hit){const r=hit.getBoundingClientRect();spawnBurst(r.left+r.width/2,r.top+r.height/2,snakeColors(a).fill)}
 message(t.removed,'good');tone('remove');haptic(7);
 slideOff(a,()=>{
  state=core.transition(level(),state,{type:'remove',id});
  log('arrow_removed',{id,remaining:state.remaining.length});
  display({force:true});
  if(state.remaining.length===0)complete();
 });
}

function hint(){

 if(!result.actions){message(t.dead,'warn');return}
 if(result.actions.length===0){message(t.already,'good');return}

 const a=result.actions[0];
 if(a.type==='toggle'){$('phaseButton').focus();message(t.hintToggle,'good')}
 else{
  const arrow=core.arrow(level(),a.id);
  const cells=core.cellsAtPhase(arrow,state.phase);
  const head=cells[cells.length-1];
  for(const [x,y] of cells){document.querySelector(`[data-x="${x}"][data-y="${y}"]`)?.classList.add('hint-cell')}
  document.querySelector(`[data-piece-id="${a.id}"]`)?.focus();
  drawRay(a.id,'clear');
  message(t.hintCell(head[1]+1,head[0]+1),'good');
  setTimeout(()=>{document.querySelectorAll('.hint-cell').forEach(el=>el.classList.remove('hint-cell'));clearRays()},1500);

function formatOptimal(actions){

  if(a.type==='toggle')return LOCALE==='zh'?'相位':'Phase';

function complete(){
 completionScheduled=true;
 const opt=level().metrics.minSteps;
 const delta=state.moves-opt;
 log('level_complete',{moves:state.moves,toggles:state.toggles,optimal:opt,mode});
 const key=mode==='daily'?('d:'+todayKey()):String(current+1);
 const old=progress.best[key];
 if(!old||state.moves<old.moves||state.moves===old.moves&&state.toggles<old.toggles)progress.best[key]={moves:state.moves,toggles:state.toggles};
 const clearedAt=todayKey();
 if(mode==='daily'){recordDailyClear(clearedAt);progress.dailyStats={...(progress.dailyStats||{}),[clearedAt]:{moves:state.moves,toggles:state.toggles,elapsed:runElapsed(),mistakes,hints:hintsUsed}}}
 else{
  if(!progress.completed.includes(current+1))progress.completed.push(current+1);
  progress.unlocked=Math.min(levels.length,Math.max(progress.unlocked,current+2));
  const stars=delta===0?3:delta<=2?2:1;progress.stars={...(progress.stars||{}),[current+1]:Math.max(progress.stars?.[current+1]||0,stars)};
 }
 persist();try{localStorage.removeItem(runStoreKey())}catch{}tone('win');
 if(!reducedMotion()){
  const board=document.querySelector('.board-frame');
  if(board){const r=board.getBoundingClientRect();spawnBurst(r.left+r.width/2,r.top+r.height/2,'#2ec4d6')}
 }
 const last=mode!=='daily'&&current===levels.length-1;
 const delay=reducedMotion()?0:420;
 const daily=mode==='daily';
 setTimeout(()=>{
  const optBtn=settings.showOptimal?`<button id="showOptBtn" type="button">${t.showOptimal}</button>`:'';
  const shareBtn=`<button class="share-copy" id="shareResult" type="button">${t.share}</button>`;
  const stats=[['moves',state.moves],['seconds',formatTime(runElapsed())],['mistakes',mistakes],['hints',hintsUsed],...(daily?[["streak",progress.dailyStreak]]:[])];
  const summary=stats.map(([label,value])=>`<div><small>${t[label]}</small><strong>${value}</strong></div>`).join('');
  const mark=daily?`<div class="result-mark">✓</div>`:`<div class="result-mark" aria-label="${t.stars}">${'★'.repeat(delta===0?3:delta<=2?2:1)}${'☆'.repeat(delta===0?0:delta<=2?1:2)}</div>`;
  openDialog(`<button class="close-button" id="modalClose" type="button" aria-label="${t.close}">×</button><div class="modal-sub">${t.winSub(last,current+1,daily)}</div>${mark}<h2 id="modalTitle">${t.winTitle(last,daily)}</h2><p>${t.winBody(state.moves,state.toggles,delta)}</p><div class="result-stats">${summary}</div><div id="optBox" class="opt-box hidden"></div><div class="modal-actions">${shareBtn}${optBtn}<button id="replayWin" type="button">${t.replay}</button>${daily?`<button class="main-button" id="dailyBackWin" type="button">${t.dailyBack}</button>`:(last?`<button class="main-button" id="viewLevelsWin" type="button">${t.viewAll}</button>`:`<button class="main-button" id="continueWin" type="button">${t.cont}</button>`)}</div>`);
  $('modalClose').onclick=()=>{completionScheduled=false;closeDialog()};
  $('shareResult').onclick=async()=>{
   const line=`Vector Shift ${daily?'Daily '+clearedAt:`Level ${current+1}`} · ${state.moves} ${LOCALE==='zh'?'步':'moves'} · ${formatTime(runElapsed())} · ${mistakes} ${LOCALE==='zh'?'误点':'misses'}${daily?` · ${progress.dailyStreak} ${LOCALE==='zh'?'天连续':'day streak'}`:''}`;
   try{if(navigator.share)await navigator.share({text:line});else{await navigator.clipboard.writeText(line);message(t.copied,'good')}}catch{}
  };
  $('replayWin').onclick=()=>{completionScheduled=false;closeDialog();reset()};
  if($('showOptBtn'))$('showOptBtn').onclick=()=>{
   const box=$('optBox');
   if(box.classList.contains('hidden')){
    const solved=core.solve(level(),core.newState(level()));
    box.innerHTML=`<div class="opt-label">${t.optimalLabel}</div><code>${formatOptimal(solved.actions||[])}</code>`;
    box.classList.remove('hidden');$('showOptBtn').textContent=t.hideOptimal;
   }else{box.classList.add('hidden');$('showOptBtn').textContent=t.showOptimal}
  };
  if(daily)$('dailyBackWin').onclick=()=>{completionScheduled=false;closeDialog();exitDaily()};
  else if(last)$('viewLevelsWin').onclick=()=>{completionScheduled=false;closeDialog();openLevels()};
  else $('continueWin').onclick=()=>{completionScheduled=false;closeDialog();select(current+1)};
 },delay);
}

 const r=btn.getBoundingClientRect();
 coach.innerHTML=`<div class="coach-card" style="top:${Math.max(12,r.top-96)}px;left:${Math.min(innerWidth-280,Math.max(12,r.left))}px"><p>${t.hintCoach}</p><button type="button" id="hintTipOk">${t.hintCoachDismiss}</button></div>`;
 coach.classList.remove('hidden');coach.setAttribute('aria-hidden','false');
 const dismiss=()=>{try{localStorage.setItem(HINT_TIP_STORE,'1')}catch{}coach.classList.add('hidden');coach.setAttribute('aria-hidden','true');coach.innerHTML=''};
 $('hintTipOk').onclick=dismiss;
}
function downloadTelemetry(){
 if(CHANNEL==='coolmath')return;
 log('telemetry_exported');
 const data={build:BUILD,channel:CHANNEL,optIn:false,localOnly:true,createdAt:new Date().toISOString(),events:telemetry};
 const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),href=URL.createObjectURL(blob),a=document.createElement('a');
 a.href=href;a.download='vector-shift-playtest.json';a.click();setTimeout(()=>URL.revokeObjectURL(href),500);
}
function maybeGameplayStart(){
 if(CHANNEL!=='crazygames-basic'||!crazyReady||gameplayStarted)return;
 try{window.CrazyGames.SDK.game.gameplayStart();gameplayStarted=true}catch{}
}
function initCrazySdk(){
 if(CHANNEL!=='crazygames-basic')return;
 const run=async()=>{
  try{
   if(!window.CrazyGames||!window.CrazyGames.SDK)return;
   await window.CrazyGames.SDK.init();
   crazyReady=true;maybeGameplayStart();
  }catch{}
 };
 if(window.CrazyGames&&window.CrazyGames.SDK)run();
 else{
  let tries=0;const timer=setInterval(()=>{tries++;if(window.CrazyGames&&window.CrazyGames.SDK){clearInterval(timer);run()}else if(tries>40)clearInterval(timer)},100);
 }
}

function openGear(){
 openDialog(`<button class="close-button" id="modalClose" aria-label="${t.close}">×</button><div class="modal-sub">${t.settingsSub}</div><h2 id="modalTitle">${t.settingsTitle}</h2>
<div class="gear-menu">
<button type="button" id="gearClassic">${LOCALE==='zh'?'绮彩长蛇图案集 ↗':'Winding paths collection ↗'}</button>
<button type="button" id="gearDaily">${t.dailyBtn}</button>
<button type="button" id="gearSettings">${t.settingsBtn}</button>
<button type="button" id="gearHelp">${t.helpBtn}</button>
<button type="button" id="gearSound">${sound?t.soundOn:t.soundOff}</button>
${CHANNEL==='coolmath'?'':`<button type="button" id="gearExport">${t.exportBtn}</button>`}
</div>
<div class="modal-actions"><button class="main-button" id="gearDone" type="button">${t.setDone}</button></div>`);
 $('modalClose').onclick=closeDialog;$('gearDone').onclick=closeDialog;
 $('gearClassic').onclick=()=>{location.href='index.html'};
 $('gearDaily').onclick=()=>{closeDialog();openDaily()};
 $('gearSettings').onclick=()=>{closeDialog();openSettings()};
 $('gearHelp').onclick=()=>{closeDialog();help()};
 $('gearSound').onclick=()=>{sound=!sound;persistSound();$('gearSound').textContent=sound?t.soundOn:t.soundOff;if($('soundButton'))$('soundButton').textContent=sound?t.soundOn:t.soundOff;tone('ui')};
 if($('gearExport'))$('gearExport').onclick=()=>{downloadTelemetry();closeDialog()};
}
applyChrome();
$('phaseButton').onclick=toggle;$('undoButton').onclick=undo;$('resetButton').onclick=reset;$('hintButton').onclick=hint;
$('zoomOutButton').onclick=()=>setZoom(zoom-0.15);
$('zoomInButton').onclick=()=>setZoom(zoom+0.15);
$('zoomResetButton').onclick=()=>{zoom=1;pan={x:0,y:0};applyBoardTransform()};
$('visualizerButton').onclick=()=>{visualizer=!visualizer;display({force:true});log('visualizer_toggle',{enabled:visualizer})};
setupBoardGestures();applyBoardTransform();
$('prevButton').onclick=()=>select(current-1);$('nextButton').onclick=()=>select(current+1);
$('levelMenuButton').onclick=openLevels;if($('helpButton'))$('helpButton').onclick=help;
if($('gearButton'))$('gearButton').onclick=openGear;
if($('settingsButton'))$('settingsButton').onclick=openSettings;
if($('dailyButton'))$('dailyButton').onclick=openDaily;
if($('exportButton'))$('exportButton').onclick=downloadTelemetry;
if($('soundButton'))$('soundButton').onclick=()=>{sound=!sound;persistSound();$('soundButton').textContent=sound?t.soundOn:t.soundOff;tone('ui')};
$('overlay').addEventListener('click',e=>{if(e.target===$('overlay')&&!completionScheduled)closeDialog()});
document.addEventListener('keydown',e=>{
 if(!$('overlay').classList.contains('hidden')){
  if(e.key==='Escape'&&!completionScheduled)closeDialog();
  if(e.key==='Tab'){
   const focusable=[...$('modal').querySelectorAll('button:not(:disabled),input:not(:disabled),[tabindex="0"]')];
   if(focusable.length){const first=focusable[0],last=focusable[focusable.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}
  }
  return
 }
 if(e.target.matches('input,textarea,select'))return;
 if(e.code==='Space'){e.preventDefault();toggle()}else if(e.key.toLowerCase()==='z')undo();else if(e.key.toLowerCase()==='r')reset();
});
window.addEventListener('resize',()=>{applyBoardTransform();sizeFxCanvas();display({force:true})});

const qp=new URLSearchParams(location.search),requested=Math.max(1,Math.min(levels.length,Number(qp.get('level'))||1));
if(CHANNEL==='demo')window.VectorShiftDebug={getLevel:()=>level(),levels,getState:()=>JSON.parse(JSON.stringify(state)),getProgress:()=>({...progress,completed:[...progress.completed]}),getTelemetry:()=>[...telemetry],getSolution:()=>core.solve(level(),state),setLevel:(n)=>{mode='campaign';select(n-1)},solveAndPlay:()=>{const s=core.solve(level(),state);if(!s.actions)return;animating=false;for(const a of s.actions){if(a.type==='toggle'){state=core.transition(level(),state,{type:'toggle'})}else{state=core.transition(level(),state,{type:'remove',id:a.id})}}display({force:true});if(state.remaining.length===0)complete()},getMode:()=>mode,getDailyIndex:()=>dailyIndex};
log('session_start',{qa,channel:CHANNEL,locale:LOCALE,build:BUILD,levels:TOTAL});
initCrazySdk();
const restored=CHANNEL==='demo'&&!qa&&!qp.has('level')&&restoreRun('campaign');
if(restored){display({force:true});message(LOCALE==='zh'?'已恢复上次进度。':'Run restored.','good');log('run_restored')}
else select((qa||requested<=progress.unlocked)?requested-1:progress.unlocked-1);
setInterval(()=>{if(state&&$('timerStat'))$('timerStat').textContent=formatTime(runElapsed())},1000);
setTimeout(showOnboarding,reducedMotion()?0:280);
})();

</script>
